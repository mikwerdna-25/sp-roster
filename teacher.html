<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stoney Point Teacher Points</title>
<style>
  :root{
    --navy:#1c2b4a;
    --navy-deep:#101c33;
    --paper:#f6f3ea;
    --card:#fffdf7;
    --rule:#d8cfb8;
    --gold:#b8862f;
    --ink:#26241d;
    --muted:#7a7364;
    --green:#3d5c2c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--navy);
    font-family:-apple-system, system-ui, sans-serif;
    color:var(--ink);
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:16px;
  }
  .sheet{
    background:var(--card);
    border-radius:12px;
    padding:20px 18px;
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
  }
  .school{
    font-family:Georgia, serif;
    font-weight:700;
    color:var(--navy);
    font-size:1.05rem;
    text-align:center;
    margin-bottom:4px;
  }
  .buildtag{
    text-align:center;
    font-size:0.62rem;
    color:var(--muted);
    margin-bottom:16px;
  }
  .state{ display:none; }
  .state.active{ display:block; }

  input[type=text], input[type=number], select{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--rule);
    border-radius:8px;
    font-size:1rem;
    font-family:inherit;
    box-sizing:border-box;
  }
  label{
    display:block;
    font-size:0.78rem;
    color:var(--muted);
    margin:10px 0 4px;
    font-weight:600;
  }
  .btn-primary{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:var(--navy);
    color:#fff;
    font-weight:800;
    font-size:1rem;
    cursor:pointer;
    margin-top:14px;
  }
  .btn-primary:active{ opacity:0.85; }
  .btn-secondary{
    background:none;
    border:none;
    color:var(--muted);
    font-size:0.8rem;
    cursor:pointer;
    text-decoration:underline;
    padding:6px 0;
  }
  .error-msg{
    color:#a34b3f;
    font-size:0.85rem;
    margin-top:8px;
    display:none;
  }
  .error-msg.active{ display:block; }

  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .teacher-name{
    font-weight:800;
    color:var(--navy);
    font-size:1.05rem;
  }
  .small-link{
    font-size:0.78rem;
    color:var(--navy);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
  }

  .search-box{ margin-bottom:16px; }
  .search-results{
    border:1px solid var(--rule);
    border-radius:8px;
    margin-top:6px;
    overflow:hidden;
  }
  .search-result-row{
    padding:10px 12px;
    border-bottom:1px solid var(--rule);
    cursor:pointer;
    font-size:0.9rem;
  }
  .search-result-row:last-child{ border-bottom:none; }
  .search-result-row:active{ background:var(--paper); }
  .search-empty{ padding:12px; color:var(--muted); font-size:0.85rem; }

  .period-group{ margin-bottom:18px; }
  .class-row.all-students{ font-weight:700; background:var(--paper); border-style:dashed; }
  .student-course{ font-size:0.78rem; color:var(--muted); margin:-2px 0 6px; }
  .period-label{
    font-size:0.72rem;
    font-weight:800;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:6px;
  }
  .class-row{
    padding:12px 14px;
    border:1px solid var(--rule);
    border-radius:8px;
    margin-bottom:8px;
    cursor:pointer;
    font-size:0.92rem;
  }
  .class-row:active{ background:var(--paper); }

  .roster-header{
    margin-bottom:10px;
  }
  .roster-title{
    font-weight:800;
    color:var(--navy);
    font-size:1.05rem;
    margin-bottom:2px;
  }
  .roster-sub{
    font-size:0.8rem;
    color:var(--muted);
  }

  .student-card{
    border:1px solid var(--rule);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .student-card.highlight{
    border-color:var(--gold);
    background:#fdf6e6;
  }
  .student-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .student-name{
    font-weight:700;
    font-size:0.95rem;
  }
  .student-total{
    font-size:0.78rem;
    color:var(--muted);
    white-space:nowrap;
  }
  .student-entry-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
  }
  .student-entry-row input{
    width:90px;
    flex:none;
  }
  .save-btn{
    padding:9px 14px;
    border:none;
    border-radius:6px;
    background:var(--green);
    color:#fff;
    font-weight:700;
    font-size:0.85rem;
    cursor:pointer;
  }
  .save-btn:disabled{ opacity:0.5; }
  .save-status{
    font-size:0.75rem;
    margin-left:4px;
  }
  .save-status.ok{ color:var(--green); }
  .save-status.err{ color:#a34b3f; }

  .history-toggle{
    font-size:0.74rem;
    color:var(--navy);
    text-decoration:underline;
    cursor:pointer;
    margin-top:6px;
    display:inline-block;
  }
  .history-grid{
    display:none;
    margin-top:8px;
    font-size:0.72rem;
    border-top:1px solid var(--rule);
    padding-top:8px;
  }
  .history-grid.active{ display:block; }
  .history-grid table{
    width:100%;
    border-collapse:collapse;
  }
  .history-grid th, .history-grid td{
    padding:3px 4px;
    text-align:center;
    border-bottom:1px solid var(--rule);
  }
  .history-grid th{ color:var(--muted); font-weight:600; }

  .spinner{
    width:28px;height:28px;
    border:4px solid var(--rule);
    border-top-color:var(--gold);
    border-radius:50%;
    margin:16px auto;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-text{ text-align:center; color:var(--muted); font-size:0.85rem; }

  /* ===== Layout for different screens =====
     Chosen by screen width and pointer type (CSS media queries), not by
     guessing the device from its name - that is more reliable, and it adapts
     when a window is resized or a tablet is rotated. */
  .history-grid{ overflow-x:auto; }
  .desktop-only{ display:none; }
  .hint-tip{ font-size:0.74rem; color:var(--muted); margin:6px 0 10px; }

  /* Phones and touch screens: bigger tap targets */
  @media (pointer:coarse){
    .save-btn{ padding:12px 16px; min-height:44px; }
    .student-entry-row input{ min-height:44px; }
    .class-row{ padding:15px 14px; }
    select{ min-height:44px; }
  }

  /* Computers and large tablets: use the width */
  @media (min-width:900px){
    .wrap{ max-width:1100px; }
    .sheet{ padding:24px 28px; }
    #weekSelect{ max-width:240px; }
    .search-box{ max-width:420px; }
    #periodGroups{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:4px 22px; align-items:start; }
    #studentList{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px 14px; align-items:start; }
    #studentList .student-card{ margin-bottom:0; }
    .class-row:hover, .search-result-row:hover{ background:var(--paper); }
  }
  @media (min-width:1350px){
    #studentList{ grid-template-columns:repeat(3, minmax(0, 1fr)); }
  }

  /* Mouse + keyboard devices only */
  @media (hover:hover) and (pointer:fine){
    .desktop-only{ display:block; }
    .save-btn:hover{ filter:brightness(1.1); }
    .small-link:hover, .history-toggle:hover{ color:var(--gold); }
  }

  /* School logo in the page header */
  .logo{ display:block; margin:0 auto 6px; height:84px; width:auto; max-width:80%; }
  @media (min-width:900px){ .logo{ height:100px; } }
  @media (min-width:900px){ #loginState, #changeCodeState{ max-width:440px; margin-left:auto; margin-right:auto; } }

  /* IGP view (read-only) */
  .igp-header{ border:2px solid var(--navy); border-radius:10px; padding:12px 14px; margin-bottom:14px; background:var(--paper); }
  .igp-title{ font-family:Georgia, serif; font-weight:700; color:var(--navy); font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase; }
  .igp-name{ font-weight:800; color:var(--navy); font-size:1.1rem; margin:2px 0 8px; }
  .igp-credit-line{ display:flex; justify-content:space-between; font-size:0.85rem; font-weight:700; color:var(--ink); }
  .igp-bar{ height:8px; background:var(--rule); border-radius:6px; overflow:hidden; margin-top:6px; }
  .igp-bar > div{ height:100%; background:var(--green); }
  .igp-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(290px, 1fr)); gap:10px; margin-bottom:6px; }
  .igp-card{ border:1px solid var(--navy); border-radius:8px; overflow:hidden; background:#fff; }
  .igp-card-head{ display:flex; justify-content:space-between; align-items:center; background:var(--navy); color:#fff; padding:6px 10px; font-size:0.74rem; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; }
  .igp-card-head .req{ font-weight:600; opacity:0.85; text-transform:none; letter-spacing:0; }
  .igp-row{ display:grid; grid-template-columns:1fr 40px 54px; gap:6px; padding:5px 10px; border-bottom:1px solid var(--rule); font-size:0.8rem; align-items:baseline; }
  .igp-row.colhead{ font-size:0.66rem; color:var(--muted); font-weight:700; text-transform:uppercase; background:var(--paper); }
  .igp-row .sub{ display:block; font-size:0.66rem; color:var(--muted); }
  .igp-row.failed{ color:var(--muted); }
  .igp-row .mk, .igp-row .cr{ text-align:center; font-weight:700; }
  .igp-foot{ display:flex; justify-content:space-between; padding:6px 10px; font-size:0.78rem; font-weight:800; background:var(--paper); }
  .igp-sect{ font-size:0.78rem; font-weight:800; color:var(--navy); text-transform:uppercase; letter-spacing:0.05em; margin:18px 0 6px; }
  .student-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--rule); border-radius:6px; margin-bottom:6px; font-size:0.88rem; }
  #igpPick, #studentPick{ width:100%; padding:11px 12px; border:1px solid var(--rule); border-radius:8px; font-size:1rem; font-family:inherit; background:#fff; }
  .student-card-ro{ padding:12px 14px; }
  .ro-sub{ font-size:0.76rem; color:var(--muted); }
  .ro-head{ font-size:0.74rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:var(--navy); margin:12px 0 4px; }
  .ro-class{ display:flex; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--rule); font-size:0.88rem; }
  .mine-tag{ font-size:0.66rem; background:var(--gold); color:#fff; border-radius:4px; padding:1px 5px; vertical-align:middle; }
  .wk-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .wk-chip{ border-radius:8px; padding:6px 8px; min-width:62px; text-align:center; border:1px solid var(--rule); }
  .wk-chip .wk-l{ font-size:0.68rem; color:var(--muted); } .wk-chip .wk-v{ font-weight:800; font-size:1rem; } .wk-chip .wk-s{ font-size:0.62rem; }
  .chip-hr{ background:#e8f0e2; border-color:#9bb88a; } .chip-hr .wk-s{ color:var(--green); font-weight:700; }
  .chip-ok{ background:#f4f1e6; border-color:#cfc6a3; } .chip-ok .wk-s{ color:var(--muted); font-weight:700; }
  .chip-p{ background:#f7e9e6; border-color:#d9a69c; } .chip-p .wk-s{ color:#a34b3f; font-weight:700; }
  .igp-need{ padding:5px 10px; font-size:0.76rem; background:#fbeeea; color:#8a3b30; border-top:1px solid var(--rule); }
  .igp-ip{ padding:5px 10px; font-size:0.76rem; background:#fbf4e3; color:#7a5a12; border-top:1px solid var(--rule); }
</style>
</head>

        <div class="hint-tip desktop-only">Tip: type a number and press Enter to save and jump to the next student.</div>
      </div>
      <div id="studentList"></div>
    </div>

    <!-- STUDENT IGP (read-only) -->
    <div class="state" id="igpState">
      <button class="small-link" id="backFromIgpBtn" style="margin-bottom:10px;">&lt; Back to class</button>
      <div class="igp-header">
        <div class="igp-title">Individual Graduation Plan (IGP)</div>
        <div class="igp-name" id="igpStudentName"></div>
        <div class="igp-credit-line"><span>CSU A-G + CDE/LAUSD Requirements</span><span id="igpCreditText"></span></div>
        <div class="igp-bar"><div id="igpCreditBar" style="width:0%"></div></div>
      </div>
      <div id="igpTranscriptNote" class="hint-tip" style="display:none; margin-bottom:8px;"></div>
      <div class="igp-grid" id="igpCategoryGrid"></div>
      <div class="igp-sect">Courses In Progress</div>
      <div id="igpInProgressList"></div>
      <div class="igp-sect">Completed at Stoney Point (points system)</div>
      <div id="igpCompletedList"></div>
    </div>

    <!-- CHANGE CODE -->
    <div class="state" id="changeCodeState">
      <button class="small-link" id="backFromChangeCodeBtn" style="margin-bottom:10px;">&lt; Back</button>
      <label>Current code</label>
      <input type="text" id="oldCodeInput" autocomplete="off">
      <label>New code (4+ characters)</label>
      <input type="text" id="newCodeInput" autocomplete="off">
      <button class="btn-primary" id="submitCodeChangeBtn">Update code</button>
      <div class="error-msg" id="changeCodeError"></div>
    </div>
  </div>
</div>

<script>
const ROSTER_ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbyMtocUhBSO_IcqIrEI4s5-C5XXWpdS9iBrfM3YqVWCgtJY1wVY8-zGpx1Pp14OPnkA/exec';

let myCode = '';
let myTeacherName = '';
let myClasses = []; // [{tab, title, period}]
let currentTab = null;
let currentWeek = null;
let highlightStudentKey = null; // "first|last" to visually highlight after a search jump

// Fall 2026 only for now - Spring weeks removed from the spreadsheet.
// This is just the fallback used before real data loads; the actual
// week list for a class comes from the server's live header row anyway,
// so this stays correct automatically even if that changes later.
const WEEK_LABELS = (function(){
  const arr = [];
  for(let i=1;i<=20;i++) arr.push('F-Wk'+i);
  return arr;
})();

function showState(id){
  document.querySelectorAll('.state').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}
function showLoading(text){
  document.getElementById('loadingText').textContent = text || 'Loading...';
  showState('loadingState');
}

function apiGet(params){
  const p = new URLSearchParams(params);
  p.set('_', Date.now());
  return fetch(ROSTER_ENDPOINT_URL + '?' + p.toString(), { cache:'no-store' })
    .then(function(res){ return res.json(); });
}

function parsePeriodFromTitle(title){
  // Title format: "COURSE NAME (P01 - Teacher)" - pull the period out.
  const m = title.match(/\(([^-\s]+)\s*-/);
  return m ? m[1] : 'Other';
}

// ---- Login ----
(function checkSetup(){
  if(ROSTER_ENDPOINT_URL === 'YOUR_APPS_SCRIPT_WEB_APP_URL' || !ROSTER_ENDPOINT_URL){
    document.getElementById('loginState').innerHTML =
      '<div class="error-msg active"><b>This page isn\'t set up yet.</b><br><br>' +
      'The Apps Script URL inside this file is still the placeholder text. ' +
      'Open teacher.html, find the line starting with <code>const ROSTER_ENDPOINT_URL</code>, ' +
      'and replace the placeholder with the real Apps Script Web app URL. Then re-upload the file.</div>';
  }
})();

document.getElementById('loginBtn').onclick = function(){
  const code = document.getElementById('codeInput').value.trim();
  if(!code) return;
  document.getElementById('loginError').classList.remove('active');
  showLoading('Logging in...');
  apiGet({ mode:'teacherclasses', code: code }).then(function(data){
    if(data.error){
      showState('loginState');
      document.getElementById('loginError').textContent = data.error;
      document.getElementById('loginError').classList.add('active');
      return;
    }
    myCode = code;
    myTeacherName = data.teacherName;
    myClasses = data.classes.map(function(c){
      return { tab: c.tab, title: c.title, period: parsePeriodFromTitle(c.title) };
    });
    renderClassList();
    showState('classListState');
    loadStudentPick();
  }).catch(function(){
    showState('loginState');
    document.getElementById('loginError').textContent = 'Could not reach the server. Check your connection and try again.';
    document.getElementById('loginError').classList.add('active');
  });
};

function renderClassList(){
  document.getElementById('teacherNameLabel').textContent = myTeacherName;
  const container = document.getElementById('periodGroups');
  container.innerHTML = '';

  const byPeriod = {};
  myClasses.forEach(function(c){
    if(!byPeriod[c.period]) byPeriod[c.period] = [];
    byPeriod[c.period].push(c);
  });
  const periods = Object.keys(byPeriod).sort(function(a, b){ return (a === 'PH') - (b === 'PH') || a.localeCompare(b); });   // Advisory last

  periods.forEach(function(period){
    const group = document.createElement('div');
    group.className = 'period-group';
    const label = document.createElement('div');
    label.className = 'period-label';
    label.textContent = period === 'PH' ? 'Period H \u2013 Advisory (Homeroom)' : 'Period ' + period;
    group.appendChild(label);
    if(byPeriod[period].length > 1){
      // A period with several courses also gets one alphabetical list of everyone in it.
      const allRow = document.createElement('div');
      allRow.className = 'class-row all-students';
      allRow.textContent = 'All students in Period ' + period + ' (A\u2013Z)';
      allRow.onclick = function(){ openPeriod(period); };
      group.appendChild(allRow);
    }
    byPeriod[period].forEach(function(c){
      const row = document.createElement('div');
      row.className = 'class-row';
      row.textContent = c.title;
      row.onclick = function(){ openClass(c.tab, null); };
      group.appendChild(row);
    });
    container.appendChild(group);
  });
}

// ---- Find a student: drop-down of every student in the school ----
let schoolStudents = [];
function loadStudentPick(){
  const sel = document.getElementById('studentPick');
  apiGet({ mode:'schoolstudents', code: myCode }).then(function(data){
    sel.innerHTML = '';
    const first = document.createElement('option');
    first.value = ''; first.textContent = (data && data.students) ? 'Choose a student (' + data.students.length + ')' : 'Could not load students';
    sel.appendChild(first);
    schoolStudents = (data && data.students) || [];
    schoolStudents.forEach(function(st, i){
      const o = document.createElement('option');
      o.value = String(i); o.textContent = st.last + ', ' + st.first;
      sel.appendChild(o);
    });
    const ip = document.getElementById('igpPick');
    ip.innerHTML = '';
    const i0 = document.createElement('option'); i0.value = ''; i0.textContent = schoolStudents.length ? 'Choose a student (' + schoolStudents.length + ')' : 'Could not load students'; ip.appendChild(i0);
    schoolStudents.forEach(function(st, i){ const o = document.createElement('option'); o.value = String(i); o.textContent = st.last + ', ' + st.first; ip.appendChild(o); });
  }).catch(function(){ sel.innerHTML = '<option value="">Could not load students - check your connection</option>'; });
}
function hEsc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ptsFmt(v){ return (Math.round(v * 100) / 100).toString(); }
// Read-only student card: any student in the school. Editing stays limited to your own classes.
function renderStudentCard(el, d, pickEl){
  const st = d.student;
  let html = '<div class="student-card-ro"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline;">' +
    '<div style="font-weight:800;color:var(--navy);">' + hEsc(st.first + ' ' + st.last) + '</div>' +
    '<button class="small-link" id="closeStudentCard">Close</button></div>' +
    (st.id ? '<div class="ro-sub">Student ID ' + hEsc(st.id) + '</div>' : '') +
    '<div class="ro-sub" style="margin-bottom:8px;">View only &mdash; you can enter points only in your own classes.</div>';
  // weekly points across all classes, last 5 weeks up to the current one
  const cw = Math.max(1, Math.min(d.weeks.length, d.currentWeek || 1));
  const from = Math.max(1, cw - 4);
  let chips = '';
  for(let w = from; w <= cw; w++){
    const v = d.weeks[w - 1];
    const live = w === d.currentWeek;
    const below = d.probationBelow || 20;
    const cls = v === null ? 'chip-none' : (v >= d.honorMin ? 'chip-hr' : (v >= below ? 'chip-ok' : 'chip-p'));
    chips += '<div class="wk-chip ' + cls + '"><div class="wk-l">Wk ' + w + (live ? '*' : '') + '</div><div class="wk-v">' + (v === null ? '&ndash;' : ptsFmt(v)) + '</div><div class="wk-s">' +
      (v === null ? '' : (v >= d.honorMin ? 'Honor Roll' : (v >= below ? 'Good standing' : 'Probation'))) + '</div></div>';
  }
  html += '<div class="ro-head">Weekly points (all classes)</div><div class="wk-chips">' + chips + '</div>' +
    (cw === d.currentWeek ? '<div class="ro-sub">* this week is still in progress</div>' : '');
  const cur = d.classes.filter(function(c){ return !c.completed; }), done = d.classes.filter(function(c){ return c.completed; });
  const row = function(c, i){
    return '<div class="ro-class"><div style="flex:1;"><div><b>' + hEsc(c.period || '') + '</b> ' + hEsc(c.course) + (c.mine ? ' <span class="mine-tag">your class</span>' : '') + '</div>' +
      '<div class="ro-sub">' + hEsc(c.teacher || 'Teacher not listed') + ' &middot; ' + (c.completed ? 'Completed' + (c.grade ? ' (' + hEsc(c.grade) + ')' : '') : ptsFmt(c.total) + (c.advisory ? ' points (go to College & Career)' : ' / 75 points')) + '</div></div>' +
      (c.mine && c.tab ? '<button class="save-btn open-mine" data-i="' + i + '">Open</button>' : '') + '</div>';
  };
  html += '<div class="ro-head">Current classes</div>' + (cur.length ? cur.map(function(c){ return row(c, d.classes.indexOf(c)); }).join('') : '<div class="ro-sub">No current classes on record.</div>');
  if(done.length) html += '<div class="ro-head">Completed this term</div>' + done.map(function(c){ return row(c, d.classes.indexOf(c)); }).join('');
  html += '</div>';
  el.innerHTML = html; el.style.display = 'block';
  el.querySelectorAll('.open-mine').forEach(function(btn){
    btn.onclick = function(){
      const c = d.classes[Number(btn.getAttribute('data-i'))];
      el.style.display = 'none'; pickEl.value = '';
      openClass(c.tab, { first: c.rowFirst, last: c.rowLast });
    };
  });
  const cl = document.getElementById('closeStudentCard');
  if(cl) cl.onclick = function(){ el.style.display = 'none'; el.innerHTML = ''; pickEl.value = ''; };
}
document.getElementById('studentPick').addEventListener('change', function(e){
  const resultsEl = document.getElementById('searchResults');
  resultsEl.innerHTML = ''; resultsEl.style.display = 'none';
  if(e.target.value === '') return;
  const st = schoolStudents[Number(e.target.value)];
  if(!st) return;
  resultsEl.innerHTML = '<div class="search-empty">Loading ' + hEsc(st.first + ' ' + st.last) + '...</div>'; resultsEl.style.display = 'block';
  const want = e.target.value;
  apiGet({ mode:'teacherviewstudent', code: myCode, id: st.id || '', first: st.first, last: st.last }).then(function(d){
    if(e.target.value !== want) return;               // they picked someone else meanwhile
    if(!d || !d.success){ resultsEl.innerHTML = '<div class="search-empty">' + hEsc((d && d.error) || 'Could not load this student.') + '</div>'; return; }
    renderStudentCard(resultsEl, d, e.target);
  }).catch(function(){ resultsEl.innerHTML = '<div class="search-empty">Could not reach the server.</div>'; });
});

// ---- Open a class roster ----
let currentWeekLabels = WEEK_LABELS;

function openClass(tab, highlightStudent){
  currentTab = tab;
  highlightStudentKey = highlightStudent ? (highlightStudent.first+'|'+highlightStudent.last).toLowerCase() : null;
  showLoading('Loading class...');
  apiGet({ mode:'classroster', code: myCode, tab: tab }).then(function(data){
    if(data.error){
      alert(data.error);
      showState('classListState');
      return;
    }
    renderRoster(data);
    showState('rosterState');
    focusFirstEntry();
  });
}

// ---- Whole period, alphabetical: every student from every course in one period ----
function openPeriod(period){
  const classes = myClasses.filter(function(c){ return c.period === period; });
  currentTab = null;
  highlightStudentKey = null;
  showLoading('Loading Period ' + period + '...');
  Promise.all(classes.map(function(c){
    return apiGet({ mode:'classroster', code: myCode, tab: c.tab }).then(function(d){ return { c: c, d: d }; })
      .catch(function(){ return { c: c, d: { error: 'Could not reach the server.' } }; });
  })).then(function(results){
    const ok = results.filter(function(r){ return !r.d.error; });
    const failed = results.filter(function(r){ return r.d.error; });
    if(ok.length === 0){
      alert(failed[0] ? failed[0].d.error : 'Could not load this period.');
      showState('classListState');
      return;
    }
    if(failed.length){
      alert('Some courses in this period could not be loaded and are not shown: ' + failed.map(function(r){ return r.c.title; }).join(', ') + '. Go back and try again.');
    }
    const merged = [];
    ok.forEach(function(r){
      const courseName = String(r.d.title || r.c.title).replace(/\s*\([^)]*\)\s*$/, '');
      (r.d.students || []).forEach(function(s){
        s._tab = r.c.tab;
        s._course = courseName;
        merged.push(s);
      });
    });
    renderRoster({
      title: 'Period ' + period + ' \u2014 all students (A\u2013Z)',
      weekLabels: ok[0].d.weekLabels,
      currentWeekLabel: ok[0].d.currentWeekLabel,
      students: merged
    });
    showState('rosterState');
    focusFirstEntry();
  });
}

function renderRoster(data){
  document.getElementById('rosterTitle').textContent = data.title;
  currentWeekLabels = (data.weekLabels && data.weekLabels.length > 0) ? data.weekLabels : WEEK_LABELS;

  const weekSelect = document.getElementById('weekSelect');
  weekSelect.innerHTML = '';
  const thisWeek = (data.currentWeekLabel && currentWeekLabels.indexOf(data.currentWeekLabel) !== -1) ? data.currentWeekLabel : null;
  currentWeekLabels.forEach(function(w){
    const opt = document.createElement('option');
    opt.value = w; opt.textContent = w + (w === thisWeek ? ' (this week)' : '');
    weekSelect.appendChild(opt);
  });
  // Every time a class is opened, start on THIS week (the server works it out from today's date).
  // A teacher who switched to an earlier week to fix something is back on this week next time.
  currentWeek = thisWeek || currentWeekLabels[0];
  weekSelect.value = currentWeek;
  weekSelect.onchange = function(){ currentWeek = weekSelect.value; renderStudentList(data.students); };

  renderStudentList(data.students);
}

function renderStudentList(students){
  students = students.slice().sort(function(a,b){
    const lastCmp = a.last.localeCompare(b.last);
    return lastCmp !== 0 ? lastCmp : a.first.localeCompare(b.first);
  });
  const list = document.getElementById('studentList');
  list.innerHTML = '';
  const entryInputs = [];
  students.forEach(function(s){
    const key = (s.first+'|'+s.last).toLowerCase();
    const card = document.createElement('div');
    card.className = 'student-card' + (key === highlightStudentKey ? ' highlight' : '');

    const top = document.createElement('div');
    top.className = 'student-top';
    const name = document.createElement('div');
    name.className = 'student-name';
    name.textContent = s.first + ' ' + s.last + (s.studentId ? ' (' + s.studentId + ')' : '');
    const total = document.createElement('div');
    total.className = 'student-total';
    const isAdv = /^Advisory-PH-/.test(s._tab || currentTab);   // advisory: no 75-point completion, points go to College & Career
    function totalText(t){ return isAdv ? 'Total: ' + t + ' pts (to College & Career)' : 'Total: ' + t + ' / 75' + (s.advisoryPts ? ' (incl. ' + s.advisoryPts + ' advisory)' : ''); }
    total.textContent = totalText(s.total);
    top.appendChild(name); top.appendChild(total);
    card.appendChild(top);
    if(s._course){
      // Shown in the whole-period view so you can tell which course each student is in.
      const courseLine = document.createElement('div');
      courseLine.className = 'student-course';
      courseLine.textContent = s._course;
      card.appendChild(courseLine);
    }

    const entryRow = document.createElement('div');
    entryRow.className = 'student-entry-row';
    const input = document.createElement('input');
    input.type = 'number';
    input.placeholder = currentWeek;
    entryInputs.push(input);
    input.addEventListener('keydown', function(ev){
      if(ev.key !== 'Enter') return;
      ev.preventDefault();
      saveBtn.click();
      const idx = entryInputs.indexOf(input);
      if(entryInputs[idx+1]) entryInputs[idx+1].focus();
    });
    const saveBtn = document.createElement('button');
    saveBtn.className = 'save-btn';
    saveBtn.textContent = 'Save';
    const status = document.createElement('span');
    status.className = 'save-status';

    saveBtn.onclick = function(){
      const val = input.value;
      if(val === '') return;
      saveBtn.disabled = true;
      status.textContent = 'Saving...';
      status.className = 'save-status';
      const savedWeek = currentWeek, savedVal = val;   // the week shown when Save was pressed
      apiGet({ mode:'submitpoints', code: myCode, tab: (s._tab || currentTab), first: s.first, last: s.last, week: savedWeek, value: val })
        .then(function(res){
          saveBtn.disabled = false;
          if(res.success){
            status.textContent = 'Saved. New total: ' + res.newTotal;
            status.className = 'save-status ok';
            total.textContent = totalText(res.newTotal);
            s.total = res.newTotal;
            // keep "View all weeks" in step with what was just saved
            const wi = currentWeekLabels.indexOf(savedWeek);
            if(wi !== -1){
              if(!s.weeks) s.weeks = [];
              while(s.weeks.length <= wi) s.weeks.push(null);
              s.weeks[wi] = Number(savedVal);
              if(histGrid.dataset.loaded) loadStudentHistory(s, histGrid);
            }
          } else {
            status.textContent = res.error || 'Failed to save.';
            status.className = 'save-status err';
          }
        }).catch(function(){
          saveBtn.disabled = false;
          status.textContent = 'Network error - try again.';
          status.className = 'save-status err';
        });
    };

    entryRow.appendChild(input);
    entryRow.appendChild(saveBtn);
    entryRow.appendChild(status);
    card.appendChild(entryRow);

    const histToggle = document.createElement('div');
    histToggle.className = 'history-toggle';
    histToggle.textContent = 'View all weeks';
    const histGrid = document.createElement('div');
    histGrid.className = 'history-grid';
    histToggle.onclick = function(){
      const isOpen = histGrid.classList.toggle('active');
      histToggle.textContent = isOpen ? 'Hide all weeks' : 'View all weeks';
      if(isOpen && !histGrid.dataset.loaded){
        loadStudentHistory(s, histGrid);
      }
    };
    const linksRow = document.createElement('div');
    linksRow.style.cssText = 'display:flex; gap:16px; flex-wrap:wrap;';
    linksRow.appendChild(histToggle);
    card.appendChild(linksRow);
    card.appendChild(histGrid);

    // Mark complete / enter grade - a deliberate action, not automatic at 75.
    const gradeRow = document.createElement('div');
    gradeRow.style.cssText = 'display:flex; align-items:center; gap:8px; margin-top:8px;';
    const gradeToggle = document.createElement('div');
    gradeToggle.className = 'history-toggle';
    function toggleLabel(){
      if(s.grade) return 'Graded: ' + s.grade + ' (tap to change or undo)';
      return s.total >= 75 ? 'Mark complete / enter grade' : 'Enter grade (under 75 points)';
    }
    gradeToggle.textContent = toggleLabel();
    const gradeForm = document.createElement('div');
    gradeForm.style.cssText = 'display:none; flex-direction:column; gap:6px; margin-top:6px;';

    function makeSelect(labelText, options){
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex; align-items:center; gap:8px;';
      const lbl = document.createElement('span');
      lbl.textContent = labelText;
      lbl.style.cssText = 'font-size:0.78rem; color:var(--muted); width:90px; flex:none;';
      const sel = document.createElement('select');
      sel.style.cssText = 'margin-bottom:0;';
      const blank = document.createElement('option');
      blank.value = ''; blank.textContent = '-- select --';
      sel.appendChild(blank);
      options.forEach(function(opt){
        const o = document.createElement('option');
        o.value = opt.value; o.textContent = opt.label;
        sel.appendChild(o);
      });
      wrap.appendChild(lbl); wrap.appendChild(sel);
      return { wrap: wrap, select: sel };
    }

    const gradeSel = makeSelect('Grade', [
      {value:'A',label:'A'}, {value:'B',label:'B'}, {value:'C',label:'C'}, {value:'D',label:'D'}
    ]);
    const whSel = makeSelect('Work Habits', [
      {value:'E',label:'(E) Excellent'}, {value:'S',label:'(S) Satisfactory'}, {value:'U',label:'(U) Unsatisfactory'}
    ]);
    const coopSel = makeSelect('Cooperation', [
      {value:'E',label:'(E) Excellent'}, {value:'S',label:'(S) Satisfactory'}, {value:'U',label:'(U) Unsatisfactory'}
    ]);
    const notesWrap = document.createElement('div');
    notesWrap.style.cssText = 'display:flex; align-items:center; gap:8px;';
    const notesLbl = document.createElement('span');
    notesLbl.textContent = 'Notes';
    notesLbl.style.cssText = 'font-size:0.78rem; color:var(--muted); width:90px; flex:none;';
    const notesInput = document.createElement('input');
    notesInput.type = 'text';
    notesInput.placeholder = 'Optional';
    notesInput.style.cssText = 'margin-bottom:0;';
    notesWrap.appendChild(notesLbl); notesWrap.appendChild(notesInput);

    const gradeSaveBtn = document.createElement('button');
    gradeSaveBtn.className = 'save-btn';
    gradeSaveBtn.textContent = 'Save completion';
    gradeSaveBtn.style.alignSelf = 'flex-start';
    const gradeStatus = document.createElement('div');
    gradeStatus.className = 'save-status';
    const undoBtn = document.createElement('button');
    undoBtn.className = 'save-btn';
    undoBtn.textContent = 'Undo completion';
    undoBtn.style.cssText = 'align-self:flex-start; background:#a34b3f;';
    undoBtn.style.display = s.grade ? '' : 'none';

    gradeToggle.onclick = function(){
      const isOpen = gradeForm.style.display === 'none';
      gradeForm.style.display = isOpen ? 'flex' : 'none';
    };
    gradeSaveBtn.onclick = function(){
      const g = gradeSel.select.value;
      const wh = whSel.select.value;
      const coop = coopSel.select.value;
      const notes = notesInput.value.trim();
      if(!g || !wh || !coop){
        gradeStatus.textContent = 'Grade, Work Habits, and Cooperation are all required.';
        gradeStatus.className = 'save-status err';
        return;
      }
      let msg = s.grade
        ? ('This student is already graded ' + s.grade + '. Replace it with the new grade?')
        : ('Mark ' + s.first + ' ' + s.last + ' complete in this course?');
      msg += '\n\nGrade: ' + g + '     Work Habits: ' + wh + '     Cooperation: ' + coop;
      if(s.total < 75) msg += '\n\nNote: this student has only ' + s.total + ' / 75 points.';
      msg += '\n\nYou can undo this from the same card for 24 hours.';
      if(!confirm(msg)) return;
      gradeSaveBtn.disabled = true;
      gradeStatus.textContent = 'Saving...';
      gradeStatus.className = 'save-status';
      apiGet({ mode:'submitgrade', code: myCode, tab: (s._tab || currentTab), first: s.first, last: s.last,
        grade: g, workHabits: wh, cooperation: coop, notes: notes })
        .then(function(res){
          gradeSaveBtn.disabled = false;
          if(res.success){
            s.grade = g;
            gradeStatus.innerHTML = (res.corrected ? 'Saved - grade corrected.' : 'Saved - course marked complete.') + '<br>' +
              '<a href="https://docs.google.com/forms/d/e/1FAIpQLSc_AUhfsFpno8a4J7nqtqHiNVQqoy2F-S2bK-uhMIVI17dkFg/viewform" target="_blank" rel="noopener" style="color:var(--navy); font-weight:700;">Open the official Course Completion Form &#8594;</a>' +
              '<br>Made a mistake? Use Undo completion (available for 24 hours).';
            gradeStatus.className = 'save-status ok';
            gradeToggle.textContent = toggleLabel();
            undoBtn.style.display = '';
          } else {
            gradeStatus.textContent = res.error || 'Failed to save.';
            gradeStatus.className = 'save-status err';
          }
        }).catch(function(){
          gradeSaveBtn.disabled = false;
          gradeStatus.textContent = 'Network error - try again.';
          gradeStatus.className = 'save-status err';
        });
    };

    gradeForm.appendChild(gradeSel.wrap);
    gradeForm.appendChild(whSel.wrap);
    gradeForm.appendChild(coopSel.wrap);
    gradeForm.appendChild(notesWrap);
    undoBtn.onclick = function(){
      if(!confirm('Undo the completion for ' + s.first + ' ' + s.last + ' (grade ' + s.grade + ')?\n\nThe course goes back to in progress. Both the entry and this undo stay in the permanent record.')) return;
      undoBtn.disabled = true;
      gradeStatus.textContent = 'Undoing...';
      gradeStatus.className = 'save-status';
      apiGet({ mode:'undocompletion', code: myCode, tab: (s._tab || currentTab), first: s.first, last: s.last })
        .then(function(res){
          undoBtn.disabled = false;
          if(res.success){
            s.grade = '';
            undoBtn.style.display = 'none';
            gradeToggle.textContent = toggleLabel();
            gradeStatus.textContent = 'Completion undone. This course is back to in progress.';
            gradeStatus.className = 'save-status ok';
          } else {
            gradeStatus.textContent = res.error || 'Could not undo.';
            gradeStatus.className = 'save-status err';
          }
        }).catch(function(){
          undoBtn.disabled = false;
          gradeStatus.textContent = 'Network error - try again.';
          gradeStatus.className = 'save-status err';
        });
    };

    gradeForm.appendChild(gradeSaveBtn);
    gradeForm.appendChild(undoBtn);
    gradeForm.appendChild(gradeStatus);
    gradeRow.appendChild(gradeToggle);
    if(!isAdv){ card.appendChild(gradeRow); card.appendChild(gradeForm); }

    list.appendChild(card);
  });
  focusFirstEntry();
}

// Computers only (mouse + keyboard): put the cursor in the first points box
// so a teacher can start typing right away. Skipped on phones/tablets, where
// it would pop up the on-screen keyboard unasked. Must run AFTER the roster
// screen is visible - browsers ignore focus on hidden elements.
function focusFirstEntry(){
  if(!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const list = document.getElementById('studentList');
  const hl = list.querySelector('.student-card.highlight input');
  const first = hl || list.querySelector('input');
  if(first) first.focus();
}

function loadStudentHistory(student, histGrid){
  // Real per-week history, rendered straight from the roster data already
  // loaded when this class was opened - no extra network call needed.
  let html = '<table><tr>';
  currentWeekLabels.forEach(function(label){ html += '<th>' + label.replace('-Wk','&#8209;') + '</th>'; });
  html += '</tr><tr>';
  (student.weeks || []).forEach(function(v){
    html += '<td>' + (v === null || v === undefined ? '&ndash;' : v) + '</td>';
  });
  html += '</tr></table>';
  histGrid.innerHTML = html;
  histGrid.dataset.loaded = '1';
}

// Requirements stated on the official IGP form (years x 10 credits). Health and
// Ethnic Studies have no year count on the form, so no target is shown for them.
const IGP_CATEGORY_META = {
  'English':               { req: 40, label: 'English', years: '4 yrs', code: 'B' },
  'Social Science':        { req: 20, label: 'Social Science', years: '2 yrs', code: 'A' },
  'Math':                  { req: 30, label: 'Math', years: '3 yrs', code: 'C' },
  'Lab Science':           { req: 20, label: 'Lab Science', years: '2 yrs', code: 'D' },
  'Language (LOTE)':       { req: 20, label: 'Language (LOTE)', years: '2 yrs', code: 'E' },
  'Visual/Performing Art': { req: 10, label: 'Visual/Perf Art', years: '1 yr', code: 'F' },
  'College Prep Elective': { req: 10, label: 'College Prep Elective', years: '1 yr', code: 'G' },
  'Physical Education':    { req: 20, label: 'Physical Education', years: '2 yrs', code: '' },
  'Health':                { req: null, label: 'Health', years: '', code: '' },
  'Ethnic Studies':        { req: null, label: 'Ethnic Studies', years: '', code: '' },
  'General Elective':      { req: null, label: 'Electives', years: '', code: '' }
};
const IGP_TOTAL_CREDITS = 210;

function mk(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

function renderIgpCategories(tr){
  const grid = document.getElementById('igpCategoryGrid');
  const note = document.getElementById('igpTranscriptNote');
  grid.innerHTML = '';
  if(!tr || tr.error || !tr.hasData){
    note.style.display = 'block';
    note.textContent = (tr && tr.error) ? tr.error : 'No transcript data loaded yet for this student - category boxes will fill in once their transcript is imported.';
    document.getElementById('igpCreditText').textContent = '- / ' + IGP_TOTAL_CREDITS;
    document.getElementById('igpCreditBar').style.width = '0%';
    return;
  }
  note.style.display = 'none';
  const earned = tr.overallCredits;
  document.getElementById('igpCreditText').textContent = 'Total Credits: ' + earned + ' / ' + IGP_TOTAL_CREDITS;
  document.getElementById('igpCreditBar').style.width = Math.min(100, Math.round(earned / IGP_TOTAL_CREDITS * 100)) + '%';

  tr.categories.forEach(function(cat){
    const meta = IGP_CATEGORY_META[cat.category] || { req: null, label: cat.category, years: '', code: '' };
    const card = mk('div', 'igp-card');
    const head = mk('div', 'igp-card-head');
    const left = mk('span', null, meta.label + (meta.years ? ' ' + meta.years : '') + (meta.code ? ' "' + meta.code + '"' : ''));
    const right = mk('span', 'req', meta.req ? (cat.totalCredits + ' / ' + meta.req) : (cat.totalCredits + ' cr'));
    head.appendChild(left); head.appendChild(right);
    card.appendChild(head);

    const colhead = mk('div', 'igp-row colhead');
    colhead.appendChild(mk('span', null, 'Course'));
    colhead.appendChild(mk('span', 'mk', 'Mark'));
    colhead.appendChild(mk('span', 'cr', 'Credits'));
    card.appendChild(colhead);

    if(cat.courses.length === 0){
      card.appendChild(mk('div', 'igp-row failed', 'No courses on record yet'));
    }
    cat.courses.forEach(function(r){
      const row = mk('div', 'igp-row' + ((r.credit === 0) ? ' failed' : ''));
      const t = mk('span', null, r.title);
      t.appendChild(mk('span', 'sub', r.school + ' \u00b7 ' + r.termEnd));
      row.appendChild(t);
      row.appendChild(mk('span', 'mk', r.mark));
      row.appendChild(mk('span', 'cr', String(r.credit)));
      card.appendChild(row);
    });

    if(cat.inProgressFor && cat.inProgressFor.length) card.appendChild(mk('div', 'igp-ip', 'In progress: ' + cat.inProgressFor.join(', ')));
    if(cat.needed && cat.needed.length) card.appendChild(mk('div', 'igp-need', 'Still needed: ' + cat.needed.join(', ')));
    else if(cat.needed && !(cat.inProgressFor && cat.inProgressFor.length) && IGP_CATEGORY_META[cat.category] && (IGP_CATEGORY_META[cat.category].req || ['Health','Ethnic Studies'].indexOf(cat.category) !== -1)) card.appendChild(mk('div', 'igp-ip', 'Requirement met'));
    const foot = mk('div', 'igp-foot');
    foot.appendChild(mk('span', null, 'Total Credits'));
    foot.appendChild(mk('span', null, String(cat.totalCredits)));
    card.appendChild(foot);
    grid.appendChild(card);
  });
}

function renderCourseRows(containerId, items, emptyText, rightFn){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  if(items.length === 0){ el.appendChild(mk('div', 'loading-text', emptyText)); return; }
  items.forEach(function(c){
    const row = mk('div', 'student-row');
    row.appendChild(mk('span', null, c.courseTitle));
    row.appendChild(mk('span', null, rightFn(c)));
    el.appendChild(row);
  });
}

let igpReturnScroll = 0;

// Opens a read-only IGP for a student on the class that is currently open.
// The server only answers for students on a class this teacher teaches.
let igpReturnState = 'classListState';
function openStudentIgp(s){
  igpReturnScroll = window.scrollY || 0;
  igpReturnState = 'classListState';
  document.getElementById('backFromIgpBtn').innerHTML = '&lt; Back';
  showLoading('Loading IGP...');
  apiGet({ mode:'teacherigpany', code: myCode, id: s.id || s.studentId || '', first: s.first, last: s.last })
    .then(function(d){
      if(d.error){ alert(d.error); showState(igpReturnState); window.scrollTo(0, igpReturnScroll); return; }
      document.getElementById('igpStudentName').textContent =
        d.first + ' ' + d.last + (d.studentId ? ' (' + d.studentId + ')' : '') + (d.gradYear ? ' \u00b7 Class of ' + d.gradYear : '');
      renderIgpCategories(d.transcript);
      renderCourseRows('igpInProgressList', d.inProgress, 'No courses in progress.', function(c){ return c.advisory ? c.total + ' pts to C&C' : c.total + ' / 75'; });
      renderCourseRows('igpCompletedList', d.completed, 'No completed courses yet.', function(c){ return 'Grade: ' + c.grade; });
      showState('igpState');
      window.scrollTo(0, 0);
    }).catch(function(){
      alert('Could not load this IGP. Check your connection and try again.');
      showState(igpReturnState);
      window.scrollTo(0, igpReturnScroll);
    });
}
document.getElementById('igpPick').addEventListener('change', function(e){
  if(e.target.value === '') return;
  const st = schoolStudents[Number(e.target.value)];
  e.target.value = '';
  if(st) openStudentIgp(st);
});
document.getElementById('backFromIgpBtn').onclick = function(){
  showState(igpReturnState);
  window.scrollTo(0, igpReturnScroll);
};

document.getElementById('backToClassesBtn').onclick = function(){
  renderClassList();
  showState('classListState');
};

// ---- Change code ----
document.getElementById('changeCodeLink').onclick = function(){
  document.getElementById('oldCodeInput').value = '';
  document.getElementById('newCodeInput').value = '';
  document.getElementById('changeCodeError').classList.remove('active');
  showState('changeCodeState');
};
document.getElementById('backFromChangeCodeBtn').onclick = function(){ showState('classListState'); };
document.getElementById('submitCodeChangeBtn').onclick = function(){
  const oldCode = document.getElementById('oldCodeInput').value.trim();
  const newCode = document.getElementById('newCodeInput').value.trim();
  const errEl = document.getElementById('changeCodeError');
  errEl.classList.remove('active');
  apiGet({ mode:'changeteachercode', oldCode: oldCode, newCode: newCode }).then(function(res){
    if(res.success){
      myCode = newCode;
      alert('Code updated. Use your new code next time you log in.');
      showState('classListState');
    } else {
      errEl.textContent = res.error || 'Could not update code.';
      errEl.classList.add('active');
    }
  });
};
