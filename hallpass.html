<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stoney Point Hall Pass</title>
<style>
  :root{ --navy:#1c2b4a; --navy-deep:#101c33; --paper:#f6f3ea; --card:#fffdf7; --rule:#d8cfb8; --gold:#b8862f; --ink:#26241d; --muted:#7a7364;
         --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--navy); font-family:-apple-system, system-ui, sans-serif; color:var(--ink); }
  .wrap{ max-width:620px; margin:0 auto; padding:16px; }
  .sheet{ background:var(--card); border-radius:14px; padding:18px 16px 20px; box-shadow:0 10px 40px rgba(0,0,0,.35); }
  .logo{ display:block; margin:0 auto 4px; height:72px; width:auto; }
  .title{ font-family:Georgia, serif; font-weight:700; color:var(--navy); text-align:center; font-size:1.15rem; }
  .clockrow{ display:flex; justify-content:center; gap:8px; align-items:center; margin:6px 0 14px; flex-wrap:wrap; }
  .clock{ font-variant-numeric:tabular-nums; font-weight:800; color:var(--navy); font-size:1.05rem; }
  .chip{ display:inline-block; background:#eef1f7; color:var(--navy); border-radius:999px; padding:3px 10px; font-size:.78rem; font-weight:700; }
  .chip.live{ background:var(--navy); color:#fff; }
  .state{ display:none; } .state.active{ display:block; }
  label{ display:block; font-weight:700; color:var(--navy); font-size:.85rem; margin:12px 0 6px; }
  input[type=text], select, textarea{ width:100%; padding:13px 12px; border:1px solid var(--rule); border-radius:10px; font-size:1.05rem; background:#fff; font-family:inherit; }
  #idInput{ font-size:1.5rem; text-align:center; letter-spacing:.08em; text-transform:uppercase; font-variant-numeric:tabular-nums; }
  .btn{ width:100%; border:none; border-radius:10px; padding:14px; font-size:1.05rem; font-weight:800; cursor:pointer; margin-top:12px; }
  .btn-primary{ background:var(--navy); color:#fff; } .btn-primary:disabled{ opacity:.5; }
  .btn-go{ background:var(--good); color:#fff; }
  .btn-light{ background:#eef1f7; color:var(--navy); }
  .err{ background:#fbe9e7; color:#a32b2b; border-radius:8px; padding:10px 12px; margin-top:10px; font-size:.92rem; display:none; }
  .err.on{ display:block; }
  .hello{ font-size:1.25rem; font-weight:800; color:var(--navy); }
  .now{ color:var(--muted); font-size:.92rem; margin-top:2px; }
  .tiles{ display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-top:8px; }
  .tile{ border:2px solid var(--rule); background:#fff; border-radius:12px; padding:14px 10px; text-align:center; cursor:pointer; font-weight:800; color:var(--navy); font-size:.98rem; min-height:64px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px; }
  .tile small{ font-weight:600; color:var(--muted); font-size:.74rem; }
  .tile.sel{ border-color:var(--navy); background:#eef1f7; box-shadow:inset 0 0 0 1px var(--navy); }
  .tile.after{ border-color:#c9b37e; background:#fff8e6; }
  .rooms{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .rooms .tile{ min-height:52px; padding:8px 4px; font-size:.9rem; }
  .perm{ display:flex; gap:8px; }
  .perm .tile{ flex:1; font-size:.88rem; min-height:54px; }
  .passcard{ border-radius:16px; padding:20px 16px; text-align:center; color:#fff; background:var(--good); margin-top:12px; transition:background .4s; }
  .passcard.warn{ background:#c98a00; } .passcard.over{ background:var(--crit); }
  .passcard .where{ font-size:1.25rem; font-weight:800; }
  .passcard .timer{ font-size:3.4rem; font-weight:900; font-variant-numeric:tabular-nums; line-height:1.1; margin:6px 0; }
  .passcard .meta{ font-size:.85rem; opacity:.95; }
  .banner{ background:#fff3cf; border:1px solid #f0d27a; color:#6b4a00; border-radius:10px; padding:10px 12px; font-size:.9rem; margin-top:10px; }
  .day{ margin-top:16px; border-top:1px solid var(--rule); padding-top:10px; }
  .dayrow{ display:flex; gap:10px; align-items:center; padding:7px 8px; border-radius:8px; font-size:.88rem; }
  .dayrow .t{ width:92px; color:var(--muted); font-variant-numeric:tabular-nums; flex:none; font-size:.8rem; }
  .dayrow .w{ flex:1; }
  .dayrow.cur{ background:#eef1f7; font-weight:700; box-shadow:inset 3px 0 0 var(--navy); }
  .dayrow.prog{ background:#fff8e6; }
  .small{ font-size:.78rem; color:var(--muted); }
  .hist div{ display:flex; justify-content:space-between; font-size:.82rem; padding:4px 0; border-bottom:1px solid #eee8d8; }
  .buildtag{ text-align:center; font-size:.62rem; color:var(--muted); margin-top:10px; }
</style>
</head>

  <div class="title">Hall Pass</div>
  <div class="clockrow"><span class="clock" id="clock">--:--</span><span class="chip" id="blockChip">Loading&hellip;</span></div>

  <div class="state active" id="idState">
    <label for="idInput">Your Student ID</label>
    <input type="text" id="idInput" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="e.g. 123108M086" maxlength="12">
    <button class="btn btn-primary" id="idGo">Continue</button>
    <div class="err" id="idErr"></div>
    <div class="small" style="margin-top:12px; text-align:center;">Check in at the station first. Your pass is shown to your teachers and the office.</div>
  </div>

  <div class="state" id="mainState">
    <div class="hello" id="hello"></div>
    <div class="now" id="nowLine"></div>
    <div id="notIn" class="banner" style="display:none;">You haven't checked in today. Check in at the check-in station first, then come back to start a pass.</div>

    <div id="activeBox" style="display:none;">
      <div class="passcard" id="passCard">
        <div class="meta" id="passMeta1"></div>
        <div class="where" id="passWhere"></div>
        <div class="timer" id="passTimer">0:00</div>
        <div class="meta" id="passMeta2"></div>
      </div>
      <button class="btn btn-go" id="backBtn" style="font-size:1.25rem; padding:18px;">I'm back</button>
    </div>

    <div id="newBox" style="display:none;">
      <label>Where are you going?</label>
      <div class="tiles" id="destTiles"></div>
      <div id="roomBox" style="display:none;"><label>Which room?</label><div class="rooms" id="roomTiles"></div></div>
      <div id="noteBox" style="display:none;"><label for="noteInput">Where? (short)</label><input type="text" id="noteInput" maxlength="120" placeholder="e.g. Library, nurse, parking lot"></div>
      <div id="fromBox" style="display:none;">
        <label for="fromSel">Leaving from</label>
        <select id="fromSel"></select>
        <label id="permLabel">Did your teacher say you can go?</label>
        <div class="perm"><div class="tile" data-perm="yes">Yes, my teacher said OK</div><div class="tile" data-perm="no">Not yet</div></div>
        <button class="btn btn-primary" id="startBtn" disabled>Start my pass</button>
      </div>
      <div class="err" id="newErr"></div>
    </div>

    <div class="day"><div style="font-weight:800; color:var(--navy); font-size:.92rem; margin-bottom:4px;">My day</div><div id="dayList"></div></div>
    <div id="histBox" class="hist" style="margin-top:10px;"></div>
    <button class="btn btn-light" id="doneBtn">Done</button>
  </div>
  <div class="buildtag">hallpass v1</div>
</div></div>

<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyMtocUhBSO_IcqIrEI4s5-C5XXWpdS9iBrfM3YqVWCgtJY1wVY8-zGpx1Pp14OPnkA/exec';
const TZ = 'America/Los_Angeles';
function apiGet(params){
  const p = new URLSearchParams(params); p.set('_', Date.now());
  return fetch(ENDPOINT + '?' + p.toString(), { cache:'no-store' }).then(function(r){ return r.json(); });
}
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
let offset = 0, me = null, myId = '', dest = null, room = '', perm = '', idleTimer = null;
function nowMs(){ return Date.now() + offset; }
const fmtClock = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour:'numeric', minute:'2-digit', second:'2-digit' });
const fmtHM = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour:'numeric', minute:'2-digit' });
const fmtParts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour:'2-digit', minute:'2-digit', hourCycle:'h23', weekday:'short' });
function ptInfo(ms){
  const o = {}; fmtParts.formatToParts(new Date(ms)).forEach(function(p){ o[p.type] = p.value; });
  return { minute: Number(o.hour) * 60 + Number(o.minute), dow: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(o.weekday) + 1 };
}
function hm(s){ const p = String(s).split(':'); return Number(p[0]) * 60 + Number(p[1]); }
function t12(s){ const m = hm(s), h = Math.floor(m / 60), mm = m % 60; return ((h + 11) % 12 + 1) + ':' + ('0' + mm).slice(-2); }
let CONFIG = null;
function blockAt(minute){
  if(!CONFIG) return null;
  for(let i = 0; i < CONFIG.bell.length; i++){ const b = CONFIG.bell[i]; if(minute >= hm(b.start) && minute < hm(b.end)) return b; }
  if(minute >= hm('13:30') && minute < hm('17:00')) return { key:'AFTER', label:'After school', start:'13:30', end:'17:00' };
  return null;
}
function roomName(id){ const r = CONFIG && CONFIG.rooms.filter(function(x){ return x.id === String(id); })[0]; return r ? r.name + (r.label && r.label !== r.name ? ' – ' + r.label : '') : (id || ''); }
function destOf(key){ return (CONFIG.destinations.filter(function(d){ return d.key === key; })[0]) || null; }
function placeOf(p){
  const pr = CONFIG.programs.filter(function(x){ return x.key === p.type; })[0], d = destOf(p.type);
  if(pr) return pr.name + (p.to ? ' (' + roomName(p.to) + ')' : '');
  if(d && d.key === 'class') return roomName(p.to);
  if(d && d.key === 'other') return p.note || 'Somewhere else';
  return d ? d.label : roomName(p.to);
}
function mmss(ms){ const s = Math.max(0, Math.floor(ms / 1000)), m = Math.floor(s / 60); return m + ':' + ('0' + (s % 60)).slice(-2); }

function tick(){
  const ms = nowMs();
  document.getElementById('clock').textContent = fmtClock.format(new Date(ms)) + ' PT';
  const info = ptInfo(ms), b = blockAt(info.minute);
  const chip = document.getElementById('blockChip');
  if(info.dow > 5){ chip.textContent = 'No school today'; chip.className = 'chip'; }
  else if(b){ chip.textContent = b.label + ' · ' + Math.max(0, hm(b.end) - info.minute) + ' min left'; chip.className = 'chip live'; }
  else chip.textContent = info.minute < hm('08:30') ? 'Before school' : 'Passing time';
  if(me && me.active){
    const p = me.active, d = destOf(p.type), el = Date.now() + offset - p.out, min = el / 60000;
    document.getElementById('passTimer').textContent = mmss(el);
    const card = document.getElementById('passCard');
    card.className = 'passcard' + (d && d.over && min >= d.over ? ' over' : (d && d.warn && min >= d.warn ? ' warn' : ''));
  }
}
setInterval(tick, 1000);

function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function(){ if(!(me && me.active)) goHome(); }, 90000);   // shared device: back to the ID screen
}
['click', 'keydown', 'touchstart'].forEach(function(ev){ document.addEventListener(ev, resetIdle, { passive:true }); });
function goHome(){
  me = null; myId = ''; dest = null; room = ''; perm = '';
  document.getElementById('idInput').value = '';
  document.getElementById('idErr').classList.remove('on');
  document.getElementById('mainState').classList.remove('active');
  document.getElementById('idState').classList.add('active');
}
document.getElementById('doneBtn').onclick = goHome;
document.getElementById('idInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') document.getElementById('idGo').click(); });
document.getElementById('idGo').onclick = function(){
  const id = document.getElementById('idInput').value.trim().toUpperCase();
  const err = document.getElementById('idErr'); err.classList.remove('on');
  if(!id){ err.textContent = 'Type your Student ID.'; err.classList.add('on'); return; }
  const btn = this; btn.disabled = true; btn.textContent = 'Looking you up…';
  load(id).then(function(ok){ btn.disabled = false; btn.textContent = 'Continue'; if(!ok) return; myId = id;
    document.getElementById('idState').classList.remove('active'); document.getElementById('mainState').classList.add('active'); resetIdle(); })
  .catch(function(){ btn.disabled = false; btn.textContent = 'Continue'; err.textContent = 'Could not reach the server. Try again.'; err.classList.add('on'); });
};
function load(id){
  return apiGet({ mode:'hpstudent', id: id }).then(function(d){
    if(!d.success){ const err = document.getElementById('idErr'); err.textContent = d.error || 'Not found.'; err.classList.add('on'); return false; }
    offset = d.nowMs - Date.now(); CONFIG = d.config; me = d; render(); tick(); return true;
  });
}

function render(){
  const d = me;
  document.getElementById('hello').textContent = 'Hi, ' + d.student.first + '!';
  const here = d.here || [];
  document.getElementById('nowLine').textContent = here.length
    ? 'You should be in ' + roomName(here[0].room) + (here[0].course ? ' · ' + here.map(function(c){ return c.course; }).join(', ') : '')
    : (d.block ? d.block.label : 'No class right now');
  document.getElementById('notIn').style.display = d.checkedIn ? 'none' : 'block';
  const act = d.active;
  document.getElementById('activeBox').style.display = act ? 'block' : 'none';
  document.getElementById('newBox').style.display = (!act && d.checkedIn) ? 'block' : 'none';
  if(act){
    const isProg = CONFIG.programs.some(function(p){ return p.key === act.type; });
    document.getElementById('passMeta1').textContent = isProg ? 'Signed in to' : 'On a pass to';
    document.getElementById('passWhere').textContent = placeOf(act);
    document.getElementById('passMeta2').textContent = 'Left ' + (act.from ? roomName(act.from) + ' ' : '') + 'at ' + fmtHM.format(new Date(act.out)) +
      (act.teacherOk === 'Not asked' ? ' · teacher not asked' : '');
    document.getElementById('backBtn').textContent = isProg ? "I'm leaving" : "I'm back";
  } else drawDestinations();
  drawDay(); drawHistory();
}
function drawDestinations(){
  const info = ptInfo(nowMs());
  const tiles = CONFIG.destinations.map(function(x){
    return '<div class="tile' + (dest === x.key ? ' sel' : '') + '" data-dest="' + x.key + '">' + esc(x.label) + (x.timer ? '<small>timed</small>' : '') + '</div>';
  });
  // after school: sign in to intervention / credit recovery
  (me.programs || []).filter(function(p){ return p.afterSchool && info.minute >= hm(p.start) - 15 && info.minute < hm(p.end); }).forEach(function(p){
    tiles.unshift('<div class="tile after' + (dest === p.key ? ' sel' : '') + '" data-dest="' + p.key + '">' + esc(p.name) + '<small>sign in · ' + t12(p.start) + '–' + t12(p.end) + '</small></div>');
  });
  document.getElementById('destTiles').innerHTML = tiles.join('');
  document.querySelectorAll('#destTiles .tile').forEach(function(t){ t.onclick = function(){ dest = t.getAttribute('data-dest'); room = ''; drawDestinations(); }; });
  const dd = dest ? destOf(dest) : null, prog = dest ? CONFIG.programs.filter(function(p){ return p.key === dest; })[0] : null;
  const needRoom = (dd && dd.pickRoom) || (prog && !prog.room);
  document.getElementById('roomBox').style.display = needRoom ? 'block' : 'none';
  if(needRoom){
    const list = CONFIG.rooms.filter(function(r){ return /^\d+$/.test(r.id) && (!me.here[0] || me.here[0].room !== r.id); });
    document.getElementById('roomTiles').innerHTML = list.map(function(r){ return '<div class="tile' + (room === r.id ? ' sel' : '') + '" data-room="' + r.id + '">' + esc(r.name.replace('Room ', 'Rm ')) + '<small>' + esc(r.label || '') + '</small></div>'; }).join('');
    document.querySelectorAll('#roomTiles .tile').forEach(function(t){ t.onclick = function(){ room = t.getAttribute('data-room'); drawDestinations(); }; });
  }
  document.getElementById('noteBox').style.display = dd && dd.needNote ? 'block' : 'none';
  document.getElementById('fromBox').style.display = dest ? 'block' : 'none';
  const fromSel = document.getElementById('fromSel');
  if(dest && !fromSel.options.length){
    const def = me.here[0] ? me.here[0].room : '';
    fromSel.innerHTML = '<option value="">(not in a class)</option>' + CONFIG.rooms.filter(function(r){ return r.id !== 'RR'; }).map(function(r){ return '<option value="' + r.id + '"' + (r.id === def ? ' selected' : '') + '>' + esc(roomName(r.id)) + '</option>'; }).join('');
  }
  document.querySelectorAll('.perm .tile').forEach(function(t){ t.classList.toggle('sel', t.getAttribute('data-perm') === perm); t.onclick = function(){ perm = t.getAttribute('data-perm'); drawDestinations(); }; });
  document.getElementById('permLabel').style.display = prog ? 'none' : 'block';
  document.querySelector('.perm').style.display = prog ? 'none' : 'flex';
  document.getElementById('startBtn').textContent = prog ? 'Sign in' : 'Start my pass';
  document.getElementById('startBtn').disabled = !dest || (needRoom && !room) || (!prog && !perm);
}
document.getElementById('startBtn').onclick = function(){
  const err = document.getElementById('newErr'); err.classList.remove('on');
  const btn = this; btn.disabled = true;
  apiGet({ mode:'hpcreate', id: myId, dest: dest, room: room, from: document.getElementById('fromSel').value, permission: perm, note: document.getElementById('noteInput').value })
    .then(function(r){
      if(!r.success){ err.textContent = r.error || 'Could not start the pass.'; err.classList.add('on'); btn.disabled = false; return; }
      dest = null; room = ''; perm = ''; document.getElementById('noteInput').value = ''; document.getElementById('fromSel').innerHTML = '';
      return load(myId);
    }).catch(function(){ err.textContent = 'Could not reach the server.'; err.classList.add('on'); btn.disabled = false; });
};
document.getElementById('backBtn').onclick = function(){
  const btn = this; btn.disabled = true;
  apiGet({ mode:'hpend', id: myId, pass: me.active.id }).then(function(r){
    btn.disabled = false;
    if(!r.success){ alert(r.error || 'Could not end the pass.'); return; }
    load(myId).then(function(){ setTimeout(goHome, 4000); });
  }).catch(function(){ btn.disabled = false; alert('Could not reach the server.'); });
};
function drawDay(){
  const info = ptInfo(nowMs()), rows = [];
  CONFIG.bell.forEach(function(b){
    const cls = (me.periods[b.key] || []), cur = info.minute >= hm(b.start) && info.minute < hm(b.end);
    let what = b.key === 'LUNCH' ? 'Lunch Area' : (cls.length ? roomName(cls[0].room) + ' · ' + cls.map(function(c){ return c.course; }).join(', ') : '—');
    rows.push({ s: b.start, e: b.end, label: b.label, what: what, cur: cur });
  });
  me.programs.filter(function(p){ return p.mine || p.afterSchool; }).forEach(function(p){
    rows.push({ s: p.start, e: p.end, label: p.name, what: p.room ? roomName(p.room) : (p.afterSchool ? (me.intervention && p.key === 'intervention' ? 'You are on the intervention list' : 'Optional') : ''), prog: true,
      cur: info.minute >= hm(p.start) && info.minute < hm(p.end) });
  });
  rows.sort(function(a, b){ return hm(a.s) - hm(b.s); });
  document.getElementById('dayList').innerHTML = rows.map(function(r){
    return '<div class="dayrow' + (r.cur ? ' cur' : '') + (r.prog ? ' prog' : '') + '"><span class="t">' + t12(r.s) + '–' + t12(r.e) + '</span><span class="w"><b>' + esc(r.label) + '</b><br><span class="small">' + esc(r.what) + '</span></span></div>';
  }).join('');
}
function drawHistory(){
  const done = (me.passes || []).filter(function(p){ return p.status !== 'Out'; });
  document.getElementById('histBox').innerHTML = done.length ? '<div style="font-weight:800;color:var(--navy);font-size:.88rem;border:none;">Today’s passes</div>' + done.map(function(p){
    return '<div><span>' + esc(fmtHM.format(new Date(p.out))) + ' · ' + esc(placeOf(p)) + '</span><span>' + (p.minutes != null ? esc(p.minutes) + ' min' : '') + '</span></div>';
  }).join('') : '';
}
CONFIG = { bell: [
  { key:'P01', label:'Period 1', start:'08:30', end:'09:20' }, { key:'P02', label:'Period 2', start:'09:20', end:'10:10' },
  { key:'P03', label:'Period 3', start:'10:10', end:'11:00' }, { key:'LUNCH', label:'Lunch / Nutrition', start:'11:00', end:'11:30' },
  { key:'P04', label:'Period 4', start:'11:30', end:'12:20' }, { key:'PH', label:'Homeroom', start:'12:20', end:'12:40' },
  { key:'P05', label:'Period 5', start:'12:40', end:'13:30' } ], programs: [], rooms: [], destinations: [] };
tick();
</script>
